name: "🔑 Setup: Generate & Install BeamUp Keys"

# Tap "Run workflow" once. Needs the GH_PAT secret (classic token:
# repo + workflow + admin:public_key). Makes the deploy keypair + app
# token and installs everything itself. No terminal, no pasting.

on:
  workflow_dispatch:

jobs:
  setup-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Require GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "Missing GH_PAT secret. Add it (classic token: repo, workflow, admin:public_key), then re-run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Generate keys
        run: |
          ssh-keygen -t ed25519 -f /tmp/beamup -N "" -C "babybeamup-deploy" -q
          APP_TOKEN=$(openssl rand -hex 16)
          echo "APP_TOKEN=$APP_TOKEN" > /tmp/app_secrets.txt
          echo "::add-mask::$APP_TOKEN"

      - name: Probe token (prints code only, never the value)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          CODE=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_PAT" https://api.github.com/user)
          echo "token probe: $CODE"
          case "$CODE" in
            200) ;;
            401|403) echo "::error::GH_PAT rejected (HTTP $CODE). Needs repo + workflow + admin:public_key."; exit 1;;
            *) echo "::error::Unexpected HTTP $CODE probing GH_PAT."; exit 1;;
          esac

      - name: Install everything
        # No login step: gh authenticates straight from GH_TOKEN env.
        run: |
          if ! gh ssh-key add /tmp/beamup.pub --title "babybeamup-deploy" 2>&1; then
            echo "::warning::Could not add the deploy key to your GitHub account. BeamUp sync may fail later."
          fi
          gh secret set BEAMUP_SSH_KEY --repo "$FACTORY_REPO" < /tmp/beamup
          gh secret set APP_TOKEN --repo "$FACTORY_REPO" < /tmp/app_secrets.txt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FACTORY_REPO: ${{ github.repository }}

      - name: Shred local copies
        if: always()
        run: rm -f /tmp/beamup /tmp/beamup.pub /tmp/app_secrets.txt

      - name: Summary
        run: |
          {
            echo "## ✅ Keys installed"
            echo ""
            echo "- SSH key → your GitHub SSH keys. Secrets → repo Settings → Secrets: \`BEAMUP_SSH_KEY\`, \`APP_TOKEN\`."
            echo "- Your app's own secrets go in \`APP_SECRETS\` (one \`KEY=value\` per line, repo Settings → Secrets)."
            echo "- Next: run **🚀 Deploy: Push App to BabyBeamUp**."
          } >> "$GITHUB_STEP_SUMMARY"
