name: 1 - Generate all keys

# Tap "Run workflow" once. Needs the GH_PAT secret (classic token:
# repo + workflow + admin:public_key). Makes the deploy keypair + app
# token and installs everything itself. No terminal, no pasting.
# No token? Follow the manual steps in SECRETS.md instead.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Require GH_PAT
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "No GH_PAT secret. See SECRETS.md (manual mode) instead." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Generate keys
        run: |
          ssh-keygen -t ed25519 -f /tmp/beamup -N "" -C "babybeamup-deploy" -q
          APP_TOKEN=$(openssl rand -hex 16)
          echo "APP_TOKEN=$APP_TOKEN" > /tmp/app_secrets.txt
          echo "::add-mask::$APP_TOKEN"

      - name: Install everything
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
          gh ssh-key add /tmp/beamup.pub --title "babybeamup-deploy" 2>&1 || true
          gh secret set BEAMUP_SSH_KEY < /tmp/beamup
          gh secret set APP_TOKEN < /tmp/app_secrets.txt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Shred local copies
        if: always()
        run: rm -f /tmp/beamup /tmp/beamup.pub /tmp/app_secrets.txt

      - name: Summary
        run: |
          {
            echo "## ✅ Keys installed"
            echo ""
            echo "- SSH key → your GitHub SSH keys. Secrets → repo Settings → Secrets: \`BEAMUP_SSH_KEY\`, \`APP_TOKEN\`."
            echo "- Next: run workflow **2 - Deploy app to baby-beamup**."
          } >> "$GITHUB_STEP_SUMMARY"
