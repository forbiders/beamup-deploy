name: 1 - Generate all keys

# STEP 1 of 2. Tap "Run workflow" once.
# Makes EVERYTHING: deploy SSH keypair + random app token.
#
# TWO MODES (your choice, nothing else to install):
#   AUTO   — paste a GH_PAT secret once (classic token: repo, workflow,
#            admin:public_key) and the workflow installs all keys itself.
#   MANUAL — no token at all. The workflow prints the keys in the run
#            summary and you paste them where SECRETS.md points
#            (2 pastes, ~1 minute). Use a PRIVATE repo for this mode.
#
# Why a token is ever needed: only GitHub's API can add SSH keys to your
# account and write repo secrets — browsers do it by hand, robots need a
# token. The deploy workflow (2) needs NO token at all.

on:
  workflow_dispatch:
    inputs:
      reveal_secrets:
        description: "SHOW generated values in the run summary (NEEDED for manual mode; ONLY for a PRIVATE repo)"
        required: false
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate all keys
        id: gen
        run: |
          ssh-keygen -t ed25519 -f /tmp/beamup -N "" -C "babybeamup-deploy" -q
          APP_TOKEN=$(openssl rand -hex 16)
          {
            echo "APP_TOKEN=$APP_TOKEN"
          } > /tmp/app_secrets.txt
          # Mask values so they NEVER appear in logs by accident.
          echo "::add-mask::$APP_TOKEN"
          {
            echo "::add-mask::$(cat /tmp/beamup)"
          } >> "$GITHUB_OUTPUT"
          echo "app_token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          echo "pubkey=$(cat /tmp/beamup.pub)" >> "$GITHUB_OUTPUT"
          {
            echo "privkey<<EOF"
            cat /tmp/beamup
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "done=yes" >> "$GITHUB_OUTPUT"

      - name: Auto-install keys (only when GH_PAT exists)
        id: auto
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "installed=no" >> "$GITHUB_OUTPUT"
            echo "No GH_PAT secret — switching to MANUAL mode (see summary)."
            exit 0
          fi
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
          gh ssh-key add /tmp/beamup.pub --title "babybeamup-deploy" 2>&1 || \
            echo "(public key may already exist — continuing)"
          gh secret set BEAMUP_SSH_KEY < /tmp/beamup
          gh secret set APP_TOKEN < /tmp/app_secrets.txt
          echo "installed=yes" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Shred local copies
        if: always()
        run: shred -u /tmp/beamup /tmp/beamup.pub /tmp/app_secrets.txt 2>/dev/null || rm -f /tmp/beamup /tmp/beamup.pub /tmp/app_secrets.txt

      - name: Summary (auto mode)
        if: ${{ steps.auto.outputs.installed == 'yes' }}
        run: |
          {
            echo "## ✅ All keys generated and stored (auto mode)"
            echo ""
            echo "- Public key added to your GitHub SSH keys (verify: avatar → Settings → SSH and GPG keys)."
            echo "- Secrets saved in THIS repo → Settings → Secrets → Actions: \`BEAMUP_SSH_KEY\`, \`APP_TOKEN\`."
            echo "- Your \`GH_PAT\` secret was only the installer — you may now delete it, or keep it for re-runs."
            echo "- App-specific secrets (e.g. \`DATABASE_URL=…\`) are yours to add as \`APP_SECRETS\` (one \`KEY=value\` per line)."
            echo "- Next: run workflow **2 - Deploy app to baby-beamup**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (manual mode — paste these yourself)
        # Shown when GH_PAT is absent AND reveal ticked. Values appear ONLY
        # here, never in README or repo files. Use a PRIVATE repo.
        if: ${{ steps.auto.outputs.installed != 'yes' && inputs.reveal_secrets }}
        run: |
          {
            echo "## ✋ Manual mode — paste these 3 things (2 minutes)"
            echo ""
            echo "### 1. Public key → avatar → Settings → SSH and GPG keys → New SSH key (title \`babybeamup-deploy\`)"
            echo '```'
            echo "${{ steps.gen.outputs.pubkey }}"
            echo '```'
            echo "### 2. Private key → THIS repo → Settings → Secrets → Actions → New secret named \`BEAMUP_SSH_KEY\`"
            echo '```'
            echo "${{ steps.gen.outputs.privkey }}"
            echo '```'
            echo "### 3. App token → same place → New secret named \`APP_TOKEN\`"
            echo '```'
            echo "${{ steps.gen.outputs.app_token }}"
            echo '```'
            echo "> PUBLIC repo warning: everyone can see this page. Make the repo"
            echo "> private first, re-run, then turn it back if you like."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (manual mode, reveal off)
        if: ${{ steps.auto.outputs.installed != 'yes' && !inputs.reveal_secrets }}
        run: |
          {
            echo "## ✋ Manual mode"
            echo ""
            echo "No \`GH_PAT\` secret found, so nothing was installed automatically."
            echo "Re-run this workflow with **reveal_secrets ticked** (private repo!)"
            echo "and the summary will show the 3 values to paste by hand."
          } >> "$GITHUB_STEP_SUMMARY"
