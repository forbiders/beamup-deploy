name: 1 - Generate all keys

# STEP 1 of 2. Tap "Run workflow" once.
# This makes EVERYTHING: deploy SSH key, server token, dashboard password,
# and stores them as secrets automatically. You paste ONE thing beforehand
# (a GitHub token, see SECRETS.md), then never touch keys again.

on:
  workflow_dispatch:
    inputs:
      reveal_secrets:
        description: "SHOW the generated passwords in the run summary (ONLY for a PRIVATE repo — public repos expose them to everyone)"
        required: false
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub CLI
        run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Generate all keys
        id: gen
        run: |
          ssh-keygen -t ed25519 -f /tmp/beamup -N "" -C "babybeamup-deploy" -q
          APP_TOKEN=$(openssl rand -hex 16)
          echo "APP_TOKEN=$APP_TOKEN" > /tmp/app_secrets.txt
          # Mask values so they NEVER appear in logs by accident.
          echo "::add-mask::$APP_TOKEN"
          # Pass to the summary step only (still masked in logs).
          echo "app_token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          echo "done=yes" >> "$GITHUB_OUTPUT"

      - name: Add public key to your GitHub account
        run: |
          gh ssh-key add /tmp/beamup.pub --title "babybeamup-deploy" 2>&1 || \
            echo "(key may already exist — continuing)"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Save private key as repo secret
        run: gh secret set BEAMUP_SSH_KEY < /tmp/beamup
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Save app passwords as repo secret
        run: gh secret set APP_SECRETS < /tmp/app_secrets.txt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Shred local copies
        if: always()
        run: shred -u /tmp/beamup /tmp/beamup.pub /tmp/app_secrets.txt 2>/dev/null || rm -f /tmp/beamup /tmp/beamup.pub /tmp/app_secrets.txt

      - name: Summary
        run: |
          {
            echo "## ✅ All keys generated and stored"
            echo ""
            echo "- Public key added to your GitHub SSH keys (verify: avatar → Settings → SSH and GPG keys)."
            echo "- Secrets saved in THIS repo → Settings → Secrets → Actions: \`BEAMUP_SSH_KEY\`, \`APP_SECRETS\`."
            echo "- Your \`GH_PAT\` secret was only the installer — you may now delete it, or keep it for re-runs."
            echo "- Next: run workflow **2 - Deploy app to baby-beamup**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reveal secrets once (opt-in only)
        # Secrets are NEVER written to README or any repo file — that would
        # publish them forever. They appear here in the run summary ONLY,
        # and only when you ticked reveal_secrets. Use a PRIVATE repo.
        if: ${{ inputs.reveal_secrets }}
        run: |
          {
            echo ""
            echo "## 🔑 Your token (shown once — copy now, it won't show again)"
            echo ""
            echo "- App token (use as password / API token wherever your app needs one): \`${{ steps.gen.outputs.app_token }}\`"
            echo "- App-specific secrets (e.g. \`DATABASE_URL=…\`, one \`KEY=value\` per line) are yours to add:"
            echo "  this repo → Settings → Secrets → Actions → \`APP_SECRETS\`. The deploy workflow applies them."
            echo ""
            echo "> If this repo is PUBLIC, everyone can see this page: make the repo"
            echo "> private first (repo → Settings → General → Danger Zone → Change visibility),"
            echo "> re-run with reveal on, then turn it back if you like."
          } >> "$GITHUB_STEP_SUMMARY"
