name: 2 - Deploy app to baby-beamup

# STEP 2 of 2. Tap "Run workflow" (optionally change inputs first).
# Checks out your app repo, syncs keys, pushes to baby-beamup.club,
# applies APP_SECRETS, and prints your live link. No CLI on your PC.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "App repo to deploy, as owner/name (example: myuser/myapp)"
        required: true
        default: ""
      project:
        description: "BeamUp project name (empty = repo name; Dockerfile apps MUST include 'docker')"
        required: false
        default: ""
      ref:
        description: "Branch/tag to deploy"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BEAMUP_HOST: a.baby-beamup.club
      GH_USER: ${{ github.repository_owner }}
    steps:
      - name: Check out app code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve names
        id: names
        run: |
          REPO_NAME="${{ inputs.target_repo }}"
          REPO_NAME="${REPO_NAME##*/}"
          PROJECT="${{ inputs.project }}"
          [ -z "$PROJECT" ] && PROJECT="$REPO_NAME"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Deploying ${{ inputs.target_repo }} as $PROJECT"

      - name: Install SSH key for BeamUp
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BEAMUP_SSH_KEY }}" > ~/.ssh/beamup
          chmod 600 ~/.ssh/beamup

      - name: Install beamup-cli (pinned)
        run: npm install -g beamup-cli@1.3.2

      - name: Sync GitHub keys to BeamUp
        run: |
          node -e "
          const {syncGithubKeys} = require('beamup-cli/lib/ssh.js');
          syncGithubKeys({host: process.env.BEAMUP_HOST, githubUsername: process.env.GH_USER})
            .then(() => console.log('SYNC_OK'))
            .catch(e => { console.error('SYNC_FAIL', e.message); process.exit(1); });
          "
          sleep 30

      - name: Push to BeamUp
        run: |
          HASH=$(printf '%s\n' "$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')" | sha256sum | cut -c1-12)
          PROJECT="${{ steps.names.outputs.project }}"
          echo "Deploying $PROJECT for $GH_USER (hash $HASH)"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/beamup -o StrictHostKeyChecking=no -o ServerAliveInterval=15"
          git remote add beamup "dokku@$BEAMUP_HOST:$HASH/$PROJECT" || true
          for i in 1 2 3; do
            git push beamup HEAD:master --force && break
            echo "push try $i failed, waiting 5 min before retry"
            sleep 300
          done
          echo "APP_URL=https://$HASH-$PROJECT.baby-beamup.club" >> "$GITHUB_ENV"

      - name: Apply app secrets (optional)
        run: |
          if [ -z "${{ secrets.APP_SECRETS }}" ]; then
            echo "No APP_SECRETS set, skipping."
            exit 0
          fi
          HASH=$(printf '%s\n' "$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')" | sha256sum | cut -c1-12)
          PROJECT="${{ steps.names.outputs.project }}"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ssh -i ~/.ssh/beamup -o StrictHostKeyChecking=no \
              "dokku@$BEAMUP_HOST" config:set "$HASH/$PROJECT" "$line"
          done <<< "${{ secrets.APP_SECRETS }}"

      - name: Show app URL
        run: |
          echo "## ✅ Pushed to BeamUp" >> "$GITHUB_STEP_SUMMARY"
          echo "Live at **$APP_URL** (allow a few minutes for first boot)." >> "$GITHUB_STEP_SUMMARY"
          echo "New apps can take ~6h before the host registry accepts them — retry later if the push was rejected." >> "$GITHUB_STEP_SUMMARY"
