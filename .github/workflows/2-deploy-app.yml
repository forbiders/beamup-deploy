name: "🚀 Deploy: Push App to BabyBeamUp"

# Deploys any repo you own. No CLI on your PC.
# Needs repo secrets: BEAMUP_SSH_KEY (from workflow 1).
# ALWAYS builds with Docker: repo's own Dockerfile, or one we generate.

# How the start file is decided (first match wins):
#   1. Repo has a Dockerfile -> used as-is.
#   2. entry_file set (bot.js, main.py, start.sh, package.json)
#      -> we write BOTH a Procfile and a Dockerfile for the push.
#   3. package.json with scripts.start -> Dockerfile runs npm start.
# Your GitHub repo is never modified — generated files exist only in
# the runner, for the push.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "App repo as UserName/RepoName"
        required: true
        default: ""
      project:
        description: "BeamUp project name (empty = repo name)"
        required: false
        default: ""
      entry_file:
        description: "Start file if repo has no Procfile (bot.js, main.py, start.sh, package.json)"
        required: false
        default: ""
      use_docker:
        description: "Build with Docker (auto-adds -docker to the name)"
        required: false
        default: true
        type: boolean
      ref:
        description: "Branch or tag"
        required: false
        default: "main"
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the README registry step below save the link
    env:
      BEAMUP_HOST: a.baby-beamup.club
      GH_USER: ${{ github.repository_owner }}
    steps:
      - name: Check out app code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve names
        id: names
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          INPUT_PROJECT: ${{ inputs.project }}
          USE_DOCKER: ${{ inputs.use_docker }}
        run: |
          REPO_NAME="$TARGET_REPO"
          REPO_NAME="${REPO_NAME##*/}"
          PROJECT="$INPUT_PROJECT"
          [ -z "$PROJECT" ] && PROJECT="$REPO_NAME"
          # Docker builds only sync when the name contains "docker".
          if [ "$USE_DOCKER" = "true" ]; then
            case "$PROJECT" in
              *docker*) ;;
              *) PROJECT="$PROJECT-docker"; echo "Name lacks 'docker', using $PROJECT";;
            esac
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Write Procfile + Dockerfile
        # Docker mode: repo's own Dockerfile wins; otherwise we generate
        # Dockerfile (+Procfile) from entry_file or package.json start.
        # Herokuish mode (use_docker=false): Procfile only, same fallback.
        # Generated files exist for the push only — repos stay untouched.
        env:
          ENTRY_FILE: ${{ inputs.entry_file }}
          USE_DOCKER: ${{ inputs.use_docker }}
        run: |
          ENTRY="$ENTRY_FILE"
          if [ "$USE_DOCKER" = "true" ] && [ -f Dockerfile ]; then
            echo "Repo Dockerfile found, using it."
            exit 0
          fi
          if [ -z "$ENTRY" ] && [ -f package.json ] && [ -f package-lock.json ]; then
            ENTRY="package.json"
          fi
          if [ -z "$ENTRY" ]; then
            echo "No Dockerfile, no Procfile, no entry_file — nothing to build. Set entry_file (bot.js, main.py, start.sh, package.json)."
            exit 1
          fi
          case "$ENTRY" in
            package.json) CMD="npm start" ;;
            *.js)         CMD="node $ENTRY" ;;
            *.py)         CMD="python $ENTRY" ;;
            *.sh)         CMD="bash $ENTRY" ;;
            *) echo "Can't start '$ENTRY'. Use bot.js, main.py, start.sh or package.json."; exit 1 ;;
          esac
          [ -f Procfile ] || echo "web: $CMD" > Procfile
          if [ "$USE_DOCKER" != "true" ]; then
            echo "Herokuish mode: Procfile ready, no Dockerfile."
            exit 0
          fi
          if [ -f package.json ]; then
            printf '%s\n' \
              "FROM node:20-slim" \
              "WORKDIR /app" \
              "COPY package*.json ./" \
              "RUN npm ci --omit=dev 2>/dev/null || npm install --omit=dev" \
              "COPY . ." \
              "ENV PORT=8080" \
              "EXPOSE 8080" \
              'CMD ["sh", "-c", "npm start"]' > Dockerfile
          elif [ -f requirements.txt ]; then
            PYCMD="$CMD"
            printf '%s\n' \
              "FROM python:3.12-slim" \
              "WORKDIR /app" \
              "COPY requirements.txt ./" \
              "RUN pip install --no-cache-dir -r requirements.txt" \
              "COPY . ." \
              "ENV PORT=8080" \
              "EXPOSE 8080" \
              "CMD [\"sh\", \"-c\", \"$PYCMD\"]" > Dockerfile
          else
            echo "No package.json or requirements.txt — can't build an image. Add dependencies file."
            exit 1
          fi
          echo "Generated Dockerfile + Procfile for the push."

      - name: Install SSH key
        env:
          BEAMUP_SSH_KEY: ${{ secrets.BEAMUP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # printf, not echo: the key is base64-ish text and echo's -n/quoting
          # behaviour is not worth relying on for a value we cannot inspect.
          printf '%s\n' "$BEAMUP_SSH_KEY" > ~/.ssh/beamup
          chmod 600 ~/.ssh/beamup

      - name: Install beamup-cli
        run: npm install -g beamup-cli@1.3.2

      - name: Sync keys to BeamUp
        run: |
          export NODE_PATH="$(npm root -g)"
          node -e "
          const {syncGithubKeys} = require('beamup-cli/lib/ssh.js');
          syncGithubKeys({host: process.env.BEAMUP_HOST, githubUsername: process.env.GH_USER})
            .then(() => console.log('SYNC_OK'))
            .catch(e => { console.error('SYNC_FAIL', e.message); process.exit(1); });
          "
          sleep 30

      - name: Push to BeamUp
        env:
          PROJECT: ${{ steps.names.outputs.project }}
        run: |
          HASH=$(printf '%s\n' "$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')" | sha256sum | cut -c1-12)
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/beamup -o StrictHostKeyChecking=no -o ServerAliveInterval=15"
          git remote add beamup "dokku@$BEAMUP_HOST:$HASH/$PROJECT" || true
          # BeamUp's pre-receive hook declines the push for anything it will not
          # accept, so a rejection here is a failed deploy and must fail the step.
          # `git push && break` did not: on three failures the loop ended on a
          # successful `sleep`, the step went green, and the app was never live.
          for i in 1 2 3; do
            if git push beamup HEAD:master --force; then
              echo "APP_URL=https://$HASH-$PROJECT.baby-beamup.club" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::BeamUp rejected attempt $i/3. See remote output above."
            [ "$i" -lt 3 ] && sleep 300
          done
          echo "::error::Deploy failed after 3 attempts. Nothing was deployed — do not trust any link below."
          exit 1

      - name: Apply app secrets
        # Skipped when APP_SECRETS is empty. One KEY=value per line.
        env:
          APP_SECRETS: ${{ secrets.APP_SECRETS }}
          PROJECT: ${{ steps.names.outputs.project }}
        run: |
          [ -z "$APP_SECRETS" ] && exit 0
          HASH=$(printf '%s\n' "$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')" | sha256sum | cut -c1-12)
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ssh -i ~/.ssh/beamup -o StrictHostKeyChecking=no \
              "dokku@$BEAMUP_HOST" config:set "$HASH/$PROJECT" "$line"
          done <<< "$APP_SECRETS"

      - name: Show links
        run: |
          echo "## ✅ Pushed to BeamUp" >> "$GITHUB_STEP_SUMMARY"
          echo "Your app: **$APP_URL** (first boot takes a few minutes)." >> "$GITHUB_STEP_SUMMARY"
          echo "Your panel (all apps): **https://baby-beamup.club**." >> "$GITHUB_STEP_SUMMARY"

      - name: Register link in README
        # Adds/updates this repo's hosted-apps table. Never duplicates rows.
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          FACTORY_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # --depth 1 because this repo *is* the workflow repo: a full clone is
          # wasted work. The token arrives via env, so a repo name cannot inject
          # shell into the URL. GitHub masks it in logs.
          git clone --quiet --depth 1 \
            "https://x-access-token:$GH_TOKEN@github.com/$FACTORY_REPO.git" .
          git config user.name "$OWNER"
          git config user.email "$OWNER@users.noreply.github.com"
          # Escape sed's replacement metachars so a repo name containing & or /
          # cannot corrupt the table.
          esc=$(printf '%s' "$TARGET_REPO" | sed -e 's/[&|\/]/\\&/g')
          ROW="| \`$TARGET_REPO\` | $APP_URL | $(date -u +%Y-%m-%d) |"
          esc_row=$(printf '%s' "$ROW" | sed -e 's/[&|\/]/\\&/g')
          if grep -qF "| \`$TARGET_REPO\` |" README.md; then
            sed -i "s#| \`$esc\` .*#$esc_row#" README.md
          else
            awk -v row="$ROW" '/<!-- hosted-apps-end -->/{print row}1' README.md > README.md.tmp && mv README.md.tmp README.md
          fi
          git add README.md
          if git diff --cached --quiet; then
            echo "Table row already current."
          else
            git commit -m "register $TARGET_REPO" --quiet
            git push origin HEAD:main --quiet
          fi
