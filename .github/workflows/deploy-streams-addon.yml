name: "📲 Deploy: Streams Addon"

# One tap, zero typing. Redeploys the live streams addon.
# Uses the normal build (keeps the current live URL as-is).

on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the README registry step below save the link
    env:
      BEAMUP_HOST: a.baby-beamup.club
      GH_USER: ${{ github.repository_owner }}
    steps:
      - name: Check out app code
        uses: actions/checkout@v4
        with:
          repository: zunex69/stremioaddon
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve names
        id: names
        run: |
          REPO_NAME="zunex69/stremioaddon"
          REPO_NAME="${REPO_NAME##*/}"
          PROJECT="pencarimovie-streams"
          [ -z "$PROJECT" ] && PROJECT="$REPO_NAME"
          # Docker builds only sync when the name contains "docker".
          if [ "false" = "true" ]; then
            case "$PROJECT" in
              *docker*) ;;
              *) PROJECT="$PROJECT-docker"; echo "Name lacks 'docker', using $PROJECT";;
            esac
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Write Procfile + Dockerfile
        # Docker mode: repo's own Dockerfile wins; otherwise we generate
        # Dockerfile (+Procfile) from entry_file or package.json start.
        # Herokuish mode (use_docker=false): Procfile only, same fallback.
        # Generated files exist for the push only — repos stay untouched.
        run: |
          ENTRY=""
          if [ "false" = "true" ] && [ -f Dockerfile ]; then
            echo "Repo Dockerfile found, using it."
            exit 0
          fi
          if [ -z "$ENTRY" ] && [ -f package.json ] && [ -f package-lock.json ]; then
            ENTRY="package.json"
          fi
          if [ -z "$ENTRY" ]; then
            echo "No Dockerfile, no Procfile, no entry_file — nothing to build. Set entry_file (bot.js, main.py, start.sh, package.json)."
            exit 1
          fi
          case "$ENTRY" in
            package.json) CMD="npm start" ;;
            *.js)         CMD="node $ENTRY" ;;
            *.py)         CMD="python $ENTRY" ;;
            *.sh)         CMD="bash $ENTRY" ;;
            *) echo "Can't start '$ENTRY'. Use bot.js, main.py, start.sh or package.json."; exit 1 ;;
          esac
          [ -f Procfile ] || echo "web: $CMD" > Procfile
          if [ "false" != "true" ]; then
            echo "Herokuish mode: Procfile ready, no Dockerfile."
            exit 0
          fi
          if [ -f package.json ]; then
            printf '%s\n' \
              "FROM node:20-slim" \
              "WORKDIR /app" \
              "COPY package*.json ./" \
              "RUN npm ci --omit=dev 2>/dev/null || npm install --omit=dev" \
              "COPY . ." \
              "ENV PORT=8080" \
              "EXPOSE 8080" \
              'CMD ["sh", "-c", "npm start"]' > Dockerfile
          elif [ -f requirements.txt ]; then
            PYCMD="$CMD"
            printf '%s\n' \
              "FROM python:3.12-slim" \
              "WORKDIR /app" \
              "COPY requirements.txt ./" \
              "RUN pip install --no-cache-dir -r requirements.txt" \
              "COPY . ." \
              "ENV PORT=8080" \
              "EXPOSE 8080" \
              "CMD [\"sh\", \"-c\", \"$PYCMD\"]" > Dockerfile
          else
            echo "No package.json or requirements.txt — can't build an image. Add dependencies file."
            exit 1
          fi
          echo "Generated Dockerfile + Procfile for the push."

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BEAMUP_SSH_KEY }}" > ~/.ssh/beamup
          chmod 600 ~/.ssh/beamup

      - name: Install beamup-cli
        run: npm install -g beamup-cli@1.3.2

      - name: Sync keys to BeamUp
        run: |
          export NODE_PATH="$(npm root -g)"
          node -e "
          const {syncGithubKeys} = require('beamup-cli/lib/ssh.js');
          syncGithubKeys({host: process.env.BEAMUP_HOST, githubUsername: process.env.GH_USER})
            .then(() => console.log('SYNC_OK'))
            .catch(e => { console.error('SYNC_FAIL', e.message); process.exit(1); });
          "
          sleep 30

      - name: Push to BeamUp
        run: |
          HASH=$(printf '%s\n' "$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')" | sha256sum | cut -c1-12)
          PROJECT="${{ steps.names.outputs.project }}"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/beamup -o StrictHostKeyChecking=no -o ServerAliveInterval=15"
          git remote add beamup "dokku@$BEAMUP_HOST:$HASH/$PROJECT" || true
          for i in 1 2 3; do
            git push beamup HEAD:master --force && break
            sleep 300
          done
          echo "APP_URL=https://$HASH-$PROJECT.baby-beamup.club" >> "$GITHUB_ENV"

      - name: Apply app secrets
        # Skipped when APP_SECRETS is empty. One KEY=value per line.
        run: |
          [ -z "${{ secrets.APP_SECRETS }}" ] && exit 0
          HASH=$(printf '%s\n' "$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')" | sha256sum | cut -c1-12)
          PROJECT="${{ steps.names.outputs.project }}"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ssh -i ~/.ssh/beamup -o StrictHostKeyChecking=no \
              "dokku@$BEAMUP_HOST" config:set "$HASH/$PROJECT" "$line"
          done <<< "${{ secrets.APP_SECRETS }}"

      - name: Show links
        run: |
          echo "## ✅ Pushed to BeamUp" >> "$GITHUB_STEP_SUMMARY"
          echo "Your app: **$APP_URL** (first boot takes a few minutes)." >> "$GITHUB_STEP_SUMMARY"
          echo "Your panel (all apps): **https://baby-beamup.club**." >> "$GITHUB_STEP_SUMMARY"

      - name: Register link in README
        # Adds/updates this repo's hosted-apps table. Never duplicates rows.
        run: |
          git clone --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/factory
          cd /tmp/factory
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          ROW="| \`zunex69/stremioaddon\` | $APP_URL | $(date -u +%Y-%m-%d) |"
          if grep -q "| \`zunex69/stremioaddon\` |" README.md; then
            sed -i "s#| \`zunex69/stremioaddon\` .*#$ROW#" README.md
          else
            awk -v row="$ROW" '/<!-- hosted-apps-end -->/{print row}1' README.md > README.md.tmp && mv README.md.tmp README.md
          fi
          git add README.md
          git diff --cached --quiet || git commit -m "register zunex69/stremioaddon" --quiet
          git push origin main --quiet || true
